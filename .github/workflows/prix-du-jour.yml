name: Prix du jour
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les prix
        run: python3 update_prices.py && python3 build.py
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "hors-sol-bot"
          git config user.email "bot@users.noreply.github.com"
          git add products.json index.html
          git diff --cached --quiet || git commit -m "Prix du $(date +%F)"
          git push
